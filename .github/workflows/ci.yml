name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build & Test Spring Boot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Make Maven Wrapper executable
        run: chmod +x ./mvnw

      - name: Check Java & Maven Version
        run: |
          java -version
          ./mvnw -version

      - name: Compile and Test
        run: ./mvnw clean test -B

      - name: Package JAR
        run: ./mvnw package -DskipTests -B

      - name: Validate Dockerfile Build
        run: docker build -t jurisprudence-backend:ci-check .
