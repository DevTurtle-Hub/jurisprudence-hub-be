spring.application.name=jurisprudence-hub-be

# ==========================================
# SERVER & REVERSE PROXY CONFIG
# ==========================================

server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
spring.threads.virtual.enabled=true

server.tomcat.threads.max=${TOMCAT_MAX_THREADS:50}
server.tomcat.threads.min-spare=${TOMCAT_MIN_SPARE_THREADS:10}
server.tomcat.connection-timeout=20000
server.tomcat.keep-alive-timeout=15000

server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain
server.compression.min-response-size=1024

# ==========================================
# POSTGRESQL & HIKARICP CONNECTION POOL
# ==========================================

spring.datasource.url=${DB_URL:${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jurisprudence_hub}}}
spring.datasource.username=${DB_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# ==========================================
# JPA & FLYWAY MIGRATION
# ==========================================

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.default_batch_fetch_size=30

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false
spring.flyway.clean-disabled=${FLYWAY_CLEAN_DISABLED:true}

# ==========================================
# JWT AUTHENTICATION
# ==========================================

# Luu y: Bat buoc phai ghi de JWT_SECRET tren moi truong production (it nhat 32 ky tu)
security.jwt.secret=${JWT_SECRET:jurisprudence_hub_dev_secret_key_must_be_overridden_in_production_2026_at_least_32_bytes}

# ==========================================
# CORS
# ==========================================

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:}
cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
cors.allowed-headers=*
cors.exposed-headers=Authorization
cors.allow-credentials=true
cors.max-age=3600

# ==========================================
# ACTUATOR & CONTAINER HEALTH PROBES
# ==========================================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.health.redis.enabled=false

# ==========================================
# MULTIPART
# ==========================================

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# ==========================================
# EXAM MODULE & HMAC ANTI-TAMPERING
# ==========================================

exam.hmac.secret=${EXAM_HMAC_SECRET:jurisprudence_hub_dev_exam_hmac_secret_key_2026}

# ==========================================
# DEFAULT ADMIN ACCOUNT
# ==========================================

app.default-admin.enabled=${APP_ADMIN_ENABLED:true}
app.default-admin.email=${APP_ADMIN_EMAIL:admin@gmail.com}
app.default-admin.password=${APP_ADMIN_PASSWORD:admin123}
app.default-admin.name=${APP_ADMIN_NAME:Quản Trị Viên CAND}
app.default-admin.unit=${APP_ADMIN_UNIT:Cục Đào tạo - Bộ Công An}

# ==========================================
# LOGGING
# ==========================================

logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

# ==========================================
# REDIS CACHE & CLOUD CONFIGURATION
# ==========================================

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
spring.data.redis.connect-timeout=2000ms
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=1000ms

spring.cache.type=redis
spring.cache.redis.time-to-live=3600000
spring.cache.redis.cache-null-values=false
spring.cache.redis.key-prefix=jurisprudence:
spring.cache.redis.use-key-prefix=true