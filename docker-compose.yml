services:
  postgres:
    image: postgres:16-alpine
    container_name: jurisprudence-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: jurisprudence_hub
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jurisprudence_hub"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jurisprudence-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/jurisprudence_hub
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-jurisprudence_hub_dev_secret_key_must_be_overridden_in_production_2026_at_least_32_bytes}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      EXAM_HMAC_SECRET: ${EXAM_HMAC_SECRET:-jurisprudence_hub_dev_exam_hmac_secret_key_2026}

volumes:
  postgres_data:
