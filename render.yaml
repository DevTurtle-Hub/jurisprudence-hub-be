services:
  - type: web
    name: jurisprudence-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: EXAM_HMAC_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: JAVA_OPTS
        value: "-Xms256m -Xmx384m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError -XX:MaxMetaspaceSize=128m -Xss512k"
      - key: FLYWAY_ENABLED
        value: "true"
      - key: FLYWAY_CLEAN_DISABLED
        value: "true"
      - key: REDIS_URL
        sync: false

