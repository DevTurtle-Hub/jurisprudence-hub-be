services:
  - type: web
    name: jurisprudence-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "10000"
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: EXAM_HMAC_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: JAVA_OPTS
        value: "-Xms96m -Xmx224m -XX:MaxMetaspaceSize=160m -Xss256k -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError -Djava.net.preferIPv4Stack=true"
      - key: FLYWAY_ENABLED
        value: "true"
      - key: FLYWAY_CLEAN_DISABLED
        value: "true"
      - key: REDIS_URL
        sync: false

