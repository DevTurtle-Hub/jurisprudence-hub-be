services:
  - type: web
    name: jurisprudence-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        fromDatabase:
          name: jurisprudence-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: jurisprudence-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: jurisprudence-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: EXAM_HMAC_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: JAVA_OPTS
        value: "-Xss512k -XX:MaxMetaspaceSize=128m"

databases:
  - name: jurisprudence-db
    databaseName: jurisprudence_hub
    user: postgres
    plan: free
    region: singapore
